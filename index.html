<!doctype html>

<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Dynamic Todo List</title>

    <link rel="stylesheet" href="style.css" />

    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
    />

    <script src="script.js" defer></script>
  </head>

  <body>
    <main class="bigbox">
      <section class="container">
        <header class="header">
          <div>
            <p class="eyebrow">PRODUCTIVITY BOARD</p>
            <h1>Simple Kanban Board</h1>
            <p class="subtitle">
              Organize your tasks and keep your workflow moving.
            </p>
          </div>
        </header>

        <div class="board">
          <!-- TO DO -->
          <section class="list" id="list1">
            <div class="list-header">
              <div class="list-title">
                <span class="status-dot todo-dot"></span>
                <h2>TO DO</h2>
              </div>

              <span class="list-number">01</span>
            </div>

            <button class="addtask" type="button">
              <i class="fa-solid fa-plus icon" aria-hidden="true"></i>
              <span>Add new task</span>
            </button>

            <form class="input">
              <input
                type="text"
                id="this-input"
                class="this-input"
                placeholder="What needs to be done?"
                autocomplete="off"
              />

              <button type="submit" id="submit-button">Add</button>
            </form>
          </section>

          <!-- IN PROGRESS -->
          <section class="list" id="list2">
            <div class="list-header">
              <div class="list-title">
                <span class="status-dot progress-dot"></span>
                <h2>IN PROGRESS</h2>
              </div>

              <span class="list-number">02</span>
            </div>
          </section>

          <!-- COMPLETED -->
          <section class="list" id="list3">
            <div class="list-header">
              <div class="list-title">
                <span class="status-dot completed-dot"></span>
                <h2>COMPLETED</h2>
              </div>

              <span class="list-number">03</span>
            </div>
          </section>
        </div>
      </section>
    </main>

    <div class="mode">
      <button class="dark-mode" id="dark-mode" type="button">
        <i class="fa-solid fa-moon"></i>
        <span>DARK-MODE</span>
      </button>
    </div>
  </body>
</html>
